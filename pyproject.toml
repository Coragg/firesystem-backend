[project]
name = "firesystem-backend"
version = "0.1.0"
description = "NASA Hackaton"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dask>=2026.8.0",
    "fastapi[standard]>=0.162.2",
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "imagecodecs>=2026.11.11",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "tifffile>=2026.11.12",
    "xarray>=2026.9.0",
    "xgboost>=3.4.1",
]


[tool.fastapi]
entrypoint = "src.main:app"
port = 5000
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "earthaccess>=0.19.0",
    "harmony-py>=1.8.0",
    "ipykernel>=7.4.0",
]
