info:
  name: root
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # API welcome endpoint

  Returns basic information about the FireSystem API. Use this request to check that the backend is reachable.

  The JSON response has this structure:

  - `success`: `true` when the request succeeds.
  - `data.message`: welcome message containing the configured project name.
  - `data.version`: project version from `pyproject.toml`.
  - `data.description`: project description from `pyproject.toml`.
