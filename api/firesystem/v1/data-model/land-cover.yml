info:
  name: land cover
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}/api/v1/data-model/land-cover"
  params:
    - name: lat
      value: "-35.4"
      type: query
      description: Latitude in decimal degrees, inside the region the model was trained on.
    - name: lon
      value: "-71.6"
      type: query
      description: Longitude in decimal degrees, inside the region the model was trained on.
    - name: max_year
      value: "2025"
      type: query
      description: Latest year allowed, YYYY; the response uses the latest year not after it.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Land cover class of a pixel

  MCD12Q1.061 `LC_Type1` (IGBP class) of the 500 m pixel containing `lat`, `lon`, for the latest year not after `max_year`. The forecast asks for the year two years before the month.

  ## Response

  `data` is `{year, igbp_class}`; both are `null` when there is no year up to `max_year`.

  ## Errors

  - `422` for a point outside the trained area.
  - `503` when the model files or the AppEEARS files are missing.
