info:
  name: terrain
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}/api/v1/data-model/terrain"
  params:
    - name: lat
      value: "-35.4"
      type: query
      description: Latitude in decimal degrees, inside the region the model was trained on.
    - name: lon
      value: "-71.6"
      type: query
      description: Longitude in decimal degrees, inside the region the model was trained on.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Elevation and slope of a pixel

  SRTMGL3 elevation (`elevation_m`) and slope (`slope_deg`) averaged over the 500 m pixel containing `lat`, `lon`.

  ## Errors

  - `422` for a point outside the trained area or a pixel without elevation.
  - `503` when the model files or the AppEEARS files are missing.
