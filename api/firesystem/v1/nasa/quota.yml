info:
  name: quota
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}/api/v1/nasa/quota"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Read FIRMS map key usage

  Returns NASA FIRMS transaction usage for the configured map key.

  Response fields:
  - `transaction_limit`: maximum transactions in the current interval.
  - `current_transactions`: transactions used in that interval.
  - `transaction_interval`: interval described by FIRMS, such as `10 minutes`.

  The API key is read from backend configuration and is never supplied by this request.
