info:
  name: sources
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}/api/v1/nasa/sources"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List FIRMS datasets and date coverage

  Returns all dataset IDs and date ranges currently reported by NASA FIRMS. These are availability ranges, not fire counts or detections.

  Each item contains:
  - `data_id`: FIRMS dataset identifier.
  - `min_date` and `max_date`: earliest and latest available dates, in GMT.
  - `extra`: additional source fields, if any; it is empty when FIRMS returns only the three fields above.

  IDs ending in `_NRT` are near-real-time active fire products; `_SP` are standard science-processing products and typically have a processing delay. `BA_MODIS` and `BA_VIIRS` are burned-area datasets, which describe mapped burned extent rather than active hotspot observations. Availability changes as FIRMS updates its data. Only the MODIS and VIIRS active fire source IDs are currently accepted by `/api/v1/fire`.
